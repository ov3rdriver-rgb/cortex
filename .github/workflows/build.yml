name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# macOS minutes are billed at 10x on private repos: don't let a newer push
# queue up behind an older run of the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            cmake_args: -G Ninja -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
            pluginval_zip: pluginval_macOS.zip
            pluginval_bin: pluginval.app/Contents/MacOS/pluginval
          - name: Windows
            os: windows-latest
            cmake_args: -A x64   # default generator = whichever Visual Studio the image has
            pluginval_zip: pluginval_Windows.zip
            pluginval_bin: pluginval.exe

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE ${{ matrix.cmake_args }}

      - name: Build
        shell: bash
        run: cmake --build build --config $BUILD_TYPE --parallel 4

      - name: Unit tests
        shell: bash
        run: ctest --test-dir build -C $BUILD_TYPE --output-on-failure

      - name: pluginval
        shell: bash
        run: |
          curl -sSfLO "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${{ matrix.pluginval_zip }}"
          unzip -q ${{ matrix.pluginval_zip }}
          for name in "Cortex" "Cortex Instrument"; do
            VST3=$(find build -type d -name "$name.vst3" -path "*VST3*" | head -1)
            echo "Validating $VST3"
            ./${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process --skip-gui-tests --timeout-ms 600000 "$VST3"
          done

      - name: pluginval (AU)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          for name in "Cortex" "Cortex Instrument"; do
            AU=$(find build -type d -name "$name.component" | head -1)
            cp -R "$AU" ~/Library/Audio/Plug-Ins/Components/
          done
          killall -9 AudioComponentRegistrar || true
          for name in "Cortex" "Cortex Instrument"; do
            ./${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process --skip-gui-tests --timeout-ms 600000 "$HOME/Library/Audio/Plug-Ins/Components/$name.component"
          done

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-${{ runner.os }}
          path: |
            build/Cortex*_artefacts/${{ env.BUILD_TYPE }}/VST3
            build/Cortex*_artefacts/${{ env.BUILD_TYPE }}/AU
            build/Cortex*_artefacts/${{ env.BUILD_TYPE }}/Standalone
            build/Cortex*_artefacts/VST3
            build/Cortex*_artefacts/AU
            build/Cortex*_artefacts/Standalone
          if-no-files-found: ignore
